.on{background:var(--ac)!important;color:var(--ac2)!important;border-color:var(--ac)!important}

.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dh h2{margin:0;font-size:20px}
.mu{color:var(--mu);font-size:13px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.cd.ok{border-color:var(--ok)}
.cd h3{margin:0 0 2px;font-size:15.5px}

.st i{color:var(--mu);font-style:normal;font-size:12px;width:32px}
.rp{display:flex;gap:6px;align-items:center;margin-top:8px}
.rp span{font-size:12px;color:var(--mu)}
.rp button{flex:1;padding:8px 0}
.sg{font-size:13px;margin-top:8px;font-weight:600}
.sg:empty{display:none}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1}
.big{width:100%;padding:13px;font-weight:650;margin-top:6px}
footer{text-align:center;padding:10px 12px 24px}
.inf{font-size:13px;margin-top:8px;padding:10px;background:var(--in);border-radius:10px}.inf p{margin:0 0 7px}.inf p:last-child{margin:0}

.bx{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}

.bx h3{margin:14px 0 4px;font-size:14px}
.bx p{margin:4px 0}

.rw span{flex:1}
.rw em{font-style:normal;color:var(--mu);font-size:12px}
.rw u{text-decoration:none;width:16px;text-align:center}
.up{color:var(--ok)}.dn{color:var(--bd)}
#ao{white-space:pre-wrap;margin-top:12px;font-size:14px}
</style></head><body>

function how(d,e){
 const[nm,sc,h]=P[d].e[e],g=sc.split('+'),q=g.map(x=>x.split('x')),n1=+q[0][0],r1=q[0][1],hi=x=>+String(x).split('-').pop();
 const t=topOf(lg(wk,d,e))||topOf(prev(wk,d,e)),b=t?t[0]:20,bo=f(Math.round(b*.87/2.5)*2.5),ex=t?'Esempio':'Esempio (numeri indicativi)';

 $('#tb').innerHTML=P.map((p,i)=>`<button data-d="${i}" class="${i==day?'on':''}"><b>G${i+1}${dn(i)?' ✓':''}</b>${p.n}</button>`).join('');
 const D=P[day];
 mn.innerHTML=`<div class="dh"><h2>${D.n}</h2><span class="mu">${D.t}</span></div><div class="mu" style="margin:4px 0 10px">RPE: 10 = cedimento · 9 = 1 rep di riserva · 8 = 2 · 7 = 3 · 6 = leggero. I numeri grigi sono quelli dell'ultima volta.</div>`+D.e.map((_,e)=>card(day,e)).join('')+
 `<button class="big ${dn(day)?'':'on'}" data-a="done">${dn(day)?'Giorno completato ✓ (tocca per riaprire)':'Completa giorno e vedi resoconto'}</button><div class="row2"><button data-a="rdD">Resoconto giorno</button><button data-a="rdW">Resoconto settimana</button></div>`}
function dst(k,d){const o={v:0,n:0,r:[],rows:[]};
 P[d].e.forEach((e,i)=>{const c=lg(k,d,i),s=val(c);if(!s.length)return;
  const t=topOf(c),pv=prev(k,d,i),pt=pv&&topOf(pv);o.v+=s.reduce((a,x)=>a+x[0]*x[1],0);o.n+=s.length;if(c.r)o.r.push(c.r);
  o.rows.push({nm:e[0],t,r:c.r,g:sug(k,d,i),q:pt?(t[0]>pt[0]||t[0]==pt[0]&&t[1]>pt[1]?1:t[0]==pt[0]&&t[1]==pt[1]?0:-1):null})});return o}
const rw=r=>`<div class="rw"><span>${r.nm}</span><b>${f(r.t[0])}×${r.t[1]}</b><em>${r.r?'RPE '+r.r:'—'}</em><u class="${r.q>0?'up':r.q<0?'dn':''}">${r.q==null?'':r.q>0?'▲':r.q<0?'▼':'='}</u></div>`;
const nx=(rows,ch)=>{const g=rows.filter(r=>r.g&&(!ch||/[↑↓]/.test(r.g)));return g.length?'<h3>Prossima volta</h3>'+g.map(r=>`<div class="rw"><span>${r.nm}<br><small class="mu">${r.g}</small></span></div>`).join(''):''};
function repD(k,d){const o=dst(k,d);if(!o.n)return`<h2>${P[d].n}</h2><p class="mu">Nessun dato registrato.</p>`;
 return`<h2>Resoconto · ${P[d].n}</h2><p>${o.n} serie · volume <b>${nf(o.v)} kg</b> · RPE medio <b>${f(av(o.r))}</b></p><p class="mu">▲ meglio dell'ultima volta · ▼ peggio</p>`+o.rows.map(rw).join('')+nx(o.rows)}
function repW(k){let v=0,n=0,r=[],rows=[],h='',pv=0;
 P.forEach((p,d)=>{const o=dst(k,d);v+=o.v;n+=o.n;r=r.concat(o.r);rows=rows.concat(o.rows);pv+=dst(shift(k,-1),d).v;
  h+=`<div class="rw"><span>G${d+1} ${p.n}${dn(d,k)?' ✓':''}</span><b>${o.n?nf(o.v)+' kg':'—'}</b></div>`});
 if(!n)return'<h2>Resoconto settimana</h2><p class="mu">Nessun dato registrato.</p>';
 const up=rows.filter(x=>x.q>0),dw=rows.filter(x=>x.q<0),mx=rows.filter(x=>x.r>=10),nm=a=>a.map(x=>x.nm).join(', ');
 return`<h2>Resoconto settimana</h2><p>${P.filter((_,d)=>dn(d,k)).length}/5 giorni completati · ${n} serie · volume <b>${nf(v)} kg</b>${pv?` (${v>=pv?'+':''}${Math.round((v/pv-1)*100)}% vs settimana prima)`:''} · RPE medio <b>${f(av(r))}</b></p>`+h+
 (up.length?`<h3 class="up">▲ Progressi (${up.length})</h3><p>${nm(up)}</p>`:'')+
 (dw.length?`<h3 class="dn">▼ In calo (${dw.length})</h3><p>${nm(dw)}</p>`:'')+
 (mx.length?`<h3>A cedimento (RPE 10)</h3><p>${nm(mx)}</p>`:'')+nx(rows,1)}
function sheet(t){ctx=t;$('#rb').innerHTML=t=='w'?repW(wk):repD(wk,day);$('#ao').textContent='';$('#sh').hidden=false;$('.bx').scrollTop=0}
const dump=(k,ds)=>ds.map(d=>P[d].n+':\n'+P[d].e.map((e,i)=>{const c=lg(k,d,i);if(!val(c).length)return'';const p=prev(k,d,i);
 return`- ${e[0]} [${e[1]}]: ${val(c).map(s=>s[0]+'x'+s[1]).join(', ')} RPE ${c.r||'?'}`+(p?` | prima: ${val(p).map(s=>s[0]+'x'+s[1]).join(', ')} RPE ${p.r||'?'}`:'')}).filter(Boolean).join('\n')).join('\n');
$('#ai').onclick=async()=>{const w=ctx=='w',ds=w?[0,1,2,3,4]:[day],dt=dump(wk,ds);
 if(!dt.includes('\n- ')){$('#ao').textContent='Inserisci prima qualche carico.';return}
 $('#ao').textContent='Analizzo…';
 try{await sm(`Sei un coach di ipertrofia. Dati di allenamento (kg x rep per ogni serie, RPE 10 = cedimento, "prima" = ultima volta). Scrivi in italiano un resoconto ${w?'della settimana':'della seduta'} breve (max 180 parole, senza titoli): cosa va bene, cosa preoccupa (RPE troppo alti, stalli, cali) e 3 indicazioni concrete sui carichi per la prossima volta.\n\n${dt}`,{onText:({text})=>{$('#ao').textContent=text}})}
 catch(e){$('#ao').textContent='Analisi non disponibile al momento.'}};
$('#cl').onclick=()=>{$('#sh').hidden=true};
$('#sh').onclick=e=>{if(e.target.id=='sh')$('#sh').hidden=true};
const rc=c=>{c.outerHTML=card(day,+c.dataset.e)};
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const c=t.closest('.cd'),a=t.dataset.a;
 if(t.dataset.d!=null){day=+t.dataset.d;render();scrollTo(0,0)}
 else if(t.id=='pw'||t.id=='nw'){wk=shift(wk,t.id=='pw'?-1:1);render()}
 else if(t.dataset.r&&c){const x=exo(day,+c.dataset.e);x.r=x.r==t.dataset.r?null:+t.dataset.r;save(wk);rc(c)}
 else if(a=='cp'&&c){const i=+c.dataset.e,pv=prev(wk,day,i),x=exo(day,i);x.s=JSON.parse(JSON.stringify(pv.s));x.r=pv.r||null;save(wk);rc(c)}
 else if(a=='cal'&&c){const k=day+'.'+c.dataset.e;cs.has(k)?cs.delete(k):cs.add(k);rc(c)}
 else if(a=='inf'&&c){const k=day+'.'+c.dataset.e;op.has(k)?op.delete(k):op.add(k);rc(c)}
 else if(a=='done'){const D=wd(day);D.done=D.done?0:Date.now();save(wk);render();if(D.done)sheet(P.every((_,i)=>dn(i))?'w':'d')}
 else if(a=='rdD')sheet('d');
 else if(a=='rdW')sheet('w')});
mn.addEventListener('input',e=>{const t=e.target,c=t.closest('.cd');if(!c||t.dataset.j==null)return;
 const i=+c.dataset.e,x=exo(day,i),j=+t.dataset.j,v=parseFloat(t.value.replace(',','.'));
 x.s[j]=x.s[j]||[null,null];x.s[j][+t.dataset.f]=isNaN(v)?null:v;save(wk);
 const cx=c.querySelector('.cx');if(cx)cx.innerHTML=calc(wk,day,i);c.classList.toggle('ok',val(x).length>0)});
load();day=Math.max(0,P.findIndex((_,i)=>!dn(i)));render();
(async()=>{try{if(!window.claude)return;
 const u=await claude.use('user'),d=await claude.use('db');sm=await claude.use('sample');if(!sm)$('#ai').hidden=true;
 if(!u||!d)return;
 col=d.collection('data/users/'+await u.id());const sn=await col.get(),rm={};
 sn.docs.forEach(x=>{const v=x.data();if(v&&v.j)rm[x.id.slice(1)]=v});
 for(const k in rm){try{const o=JSON.parse(rm[k].j);if(!S[k]||(S[k]._t||0)<(o._t||0))S[k]=o}catch(e){}}
 for(const k in S)if(!rm[k]||(S[k]._t||0)>(rm[k].t||0))col.doc('w'+k).set({j:JSON.stringify(S[k]),t:S[k]._t||Date.now()}).catch(()=>{});
 try{localStorage.setItem('gym1',JSON.stringify(S))}catch(e){}
 if(!document.activeElement||document.activeElement.tagName!='INPUT')render();
 $('#sy').textContent='☁ Dati salvati sul tuo account'}catch(e){}})();
</script></body></html>
